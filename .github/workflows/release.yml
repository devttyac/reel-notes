name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release or refresh (for example v0.1.11)'
        required: true
        type: string

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Build skill bundles
        run: bash scripts/build-skills.sh

      - name: Extract release notes from CHANGELOG
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import os
          import sys

          tag = os.environ["RELEASE_TAG"]
          lines = Path("CHANGELOG.md").read_text(encoding="utf-8").splitlines()
          header = f"## {tag}"
          capture = False
          captured = []

          for line in lines:
              if not capture and line.startswith(header):
                  capture = True
                  continue
              if capture and line.startswith("## "):
                  break
              if capture:
                  captured.append(line)

          body = "\n".join(captured).strip() + "\n"
          if not capture or not body.strip():
              sys.stderr.write(f"No changelog section found for {tag}\n")
              sys.exit(1)

          Path("RELEASE_NOTES.md").write_text(body, encoding="utf-8")
          PY

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65  # v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          files: |
            dist/sumtube.skill
            dist/media-downloader.skill
          body_path: RELEASE_NOTES.md
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
